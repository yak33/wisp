[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ZHANGCHAO"]

[workspace.dependencies]
wisp-core = { path = "crates/core" }

# UI 层：与 PoC 验证过的组合一致（gpui-component 锁 rev，gpui 跟随其要求）
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "be6f5a7d6fcd306f747c0bf47b1e3c17d2fbd014" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "be6f5a7d6fcd306f747c0bf47b1e3c17d2fbd014" }
raw-window-handle = "0.6"

# 系统集成
global-hotkey = "0.7"
tray-icon = "0.21"

# 基础设施
anyhow = "1"
async-channel = "2"
crossbeam-channel = "0.5"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# 唤起型工具对体积/速度敏感，release 全量优化
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
